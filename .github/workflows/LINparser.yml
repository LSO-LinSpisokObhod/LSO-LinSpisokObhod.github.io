name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write

concurrency:
  group: "parser"
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      # ── 1. Парсер ───────────────────────────────────────────────
      - name: Run collector script
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      # ── 2. GitVerse ─────────────────────────────────────────────
      - name: Upload sub/ to GitVerse
        continue-on-error: true
        env:
          GITVERSE_USER:     ${{ secrets.GITVERSE_USER }}
          GITVERSE_REPO:     ${{ secrets.GITVERSE_REPO }}
          GITVERSE_PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
          GITVERSE_BRANCH:   ${{ secrets.GITVERSE_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob
          [ -z "$GITVERSE_USER" ] || [ -z "$GITVERSE_REPO" ] || [ -z "$GITVERSE_PASSWORD" ] && \
            { echo "::warning::GitVerse: пропуск"; exit 0; }
          if [[ "$GITVERSE_REPO" == */* ]]; then
            OWNER="${GITVERSE_REPO%%/*}"; REPO="${GITVERSE_REPO#*/}"
          else
            OWNER="$GITVERSE_USER"; REPO="$GITVERSE_REPO"
          fi
          echo "📦 GitVerse target: $OWNER/$REPO @ $GITVERSE_BRANCH"
          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitVerse: нет sub/*.64.txt"; exit 0; }
          AUTH="$(printf '%s:%s' "$GITVERSE_USER" "$GITVERSE_PASSWORD" | base64 -w0)"
          REPO_URL="https://gitverse.ru/${OWNER}/${REPO}.git"
          WORK="$(mktemp -d)"
          if ! git -c http.extraHeader="Authorization: Basic $AUTH" \
               clone --depth=1 --branch "$GITVERSE_BRANCH" "$REPO_URL" "$WORK/repo" 2>/dev/null; then
            git init -b "$GITVERSE_BRANCH" "$WORK/repo"
            git -C "$WORK/repo" remote add origin "$REPO_URL"
          fi
          cd "$WORK/repo"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"; cp "$f" "sub/${base}.txt"
          done
          git add -- sub/
          git diff --cached --quiet && { echo "ℹ GitVerse: изменений нет"; exit 0; }
          outside="$(git diff --cached --name-only | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }
          git commit -m "Sync sub/ [skip ci]"
          git -c http.extraHeader="Authorization: Basic $AUTH" push origin "$GITVERSE_BRANCH"
          echo "✅ GitVerse: $OWNER/$REPO@$GITVERSE_BRANCH обновлён"

      # ── 3. Mos.Hub: https://{user}:{token}@hub.mos.ru/... ──────
      - name: Upload sub/ to Mos.Hub
        continue-on-error: true
        env:
          MOSHUB_USER:   ${{ secrets.MOSHUB_USER }}
          MOSHUB_TOKEN:  ${{ secrets.MOSHUB_TOKEN }}
          MOSHUB_REPO:   ${{ secrets.MOSHUB_REPO }}
          MOSHUB_BRANCH: ${{ secrets.MOSHUB_BRANCH || 'main' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$MOSHUB_USER" ] || [ -z "$MOSHUB_TOKEN" ] || [ -z "$MOSHUB_REPO" ]; then
            echo "::warning::Mos.Hub: пропуск — не заданы MOSHUB_USER/TOKEN/REPO"
            exit 0
          fi
          if [[ "$MOSHUB_REPO" != */* ]]; then
            echo "::warning::Mos.Hub: MOSHUB_REPO должен быть owner/repo — пропуск"
            exit 0
          fi

          OWNER="${MOSHUB_REPO%%/*}"
          REPO="${MOSHUB_REPO#*/}"
          echo "📦 Mos.Hub target: $OWNER/$REPO @ $MOSHUB_BRANCH"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ Mos.Hub: нет sub/*.64.txt"; exit 0; }

          AUTHED_URL="https://${MOSHUB_USER}:${MOSHUB_TOKEN}@hub.mos.ru/${OWNER}/${REPO}.git"
          CLEAN_URL="https://hub.mos.ru/${OWNER}/${REPO}.git"

          WORK="$(mktemp -d)/repo"
          echo "📥 Mos.Hub: клонирую → $WORK"
          if ! git clone --depth=1 --branch "$MOSHUB_BRANCH" "$AUTHED_URL" "$WORK" 2>/dev/null; then
            echo "⚠ Mos.Hub: клон не удался — создаю пустой репо"
            rm -rf "$WORK"
            git init -b "$MOSHUB_BRANCH" "$WORK"
            git -C "$WORK" remote add origin "$CLEAN_URL"
          else
            git -C "$WORK" remote set-url origin "$CLEAN_URL"
          fi

          cd "$WORK"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"

          NEED_UPDATE=0
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then
              NEED_UPDATE=1; break
            fi
          done
          [ "$NEED_UPDATE" = "0" ] && { echo "ℹ Mos.Hub: содержимое не изменилось"; exit 0; }

          echo "🗑 Mos.Hub: удаляю старую sub/"
          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            cp "$f" "sub/$(basename "$f")"
            echo "   $(basename "$f") → sub/$(basename "$f")"
          done
          git add -- sub/
          git commit -m "Upload sub as .64.txt [skip ci]" >/dev/null
          echo "📝 Mos.Hub: коммит 1 — .64.txt"

          cd sub/
          for f in *.64.txt; do
            git mv "$f" "${f%.64.txt}.txt"
            echo "   $(basename "$f") → ${f%.64.txt}.txt"
          done
          cd ..
          git commit -m "Rename .64.txt to .txt [skip ci]" >/dev/null
          echo "📝 Mos.Hub: коммит 2 — .txt"

          outside="$(git diff --name-only HEAD~2 HEAD 2>/dev/null | grep -v '^sub/' || true)"
          if [ -n "$outside" ]; then
            echo "❌ Mos.Hub: файлы вне sub/ — отмена"
            printf '   %s\n' "$outside"; exit 1
          fi

          if ! git push "$AUTHED_URL" "$MOSHUB_BRANCH" 2>/dev/null; then
            echo "::error::Mos.Hub: push отклонён — проверь MOSHUB_USER, MOSHUB_TOKEN (write_repository), MOSHUB_REPO"
            exit 1
          fi
          echo "✅ Mos.Hub: $OWNER/$REPO@$MOSHUB_BRANCH обновлён (2 коммита)"

      # ── 4. GitFlic ──────────────────────────────────────────────
      - name: Upload sub/ to GitFlic
        continue-on-error: true
        env:
          GITFLIC_USER:   ${{ secrets.GITFLIC_USER }}
          GITFLIC_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
          GITFLIC_REPO:   ${{ secrets.GITFLIC_REPO }}
          GITFLIC_BRANCH: ${{ secrets.GITFLIC_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob
          if [ -z "$GITFLIC_TOKEN" ] || [ -z "$GITFLIC_USER" ] || [ -z "$GITFLIC_REPO" ]; then
            echo "::warning::GitFlic: пропуск"; exit 0
          fi
          if [[ "$GITFLIC_REPO" != */* ]]; then
            echo "::warning::GitFlic: GITFLIC_REPO должен быть owner/repo"; exit 0
          fi
          OWNER="${GITFLIC_REPO%%/*}"
          REPO="${GITFLIC_REPO#*/}"
          echo "📦 GitFlic target: $OWNER/$REPO @ $GITFLIC_BRANCH"
          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitFlic: нет sub/*.64.txt"; exit 0; }
          AUTHED_URL="https://${GITFLIC_USER}:${GITFLIC_TOKEN}@gitflic.ru/project/${OWNER}/${REPO}.git"
          CLEAN_URL="https://gitflic.ru/project/${OWNER}/${REPO}.git"
          WORK="$(mktemp -d)/repo"
          if ! git clone --depth=1 --branch "$GITFLIC_BRANCH" "$AUTHED_URL" "$WORK" 2>/dev/null; then
            rm -rf "$WORK"
            git init -b "$GITFLIC_BRANCH" "$WORK"
            git -C "$WORK" remote add origin "$CLEAN_URL"
          else
            git -C "$WORK" remote set-url origin "$CLEAN_URL"
          fi
          cd "$WORK"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          NEED_UPDATE=0
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then
              NEED_UPDATE=1; break
            fi
          done
          [ "$NEED_UPDATE" = "0" ] && { echo "ℹ GitFlic: не изменилось"; exit 0; }
          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            cp "$f" "sub/$(basename "$f")"
          done
          git add -- sub/
          git commit -m "Upload sub as .64.txt [skip ci]" >/dev/null
          echo "📝 GitFlic: коммит 1 — .64.txt"
          cd sub/
          for f in *.64.txt; do
            git mv "$f" "${f%.64.txt}.txt"
          done
          cd ..
          git commit -m "Rename .64.txt to .txt [skip ci]" >/dev/null
          echo "📝 GitFlic: коммит 2 — .txt"
          outside="$(git diff --name-only HEAD~2 HEAD 2>/dev/null | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }
          if ! git push "$AUTHED_URL" "$GITFLIC_BRANCH" 2>/dev/null; then
            echo "::error::GitFlic: push отклонён — проверь GITFLIC_USER, GITFLIC_TOKEN, GITFLIC_REPO"
            exit 1
          fi
          echo "✅ GitFlic: $OWNER/$REPO@$GITFLIC_BRANCH обновлён (2 коммита)"

      # ── 5. Убираем .64.txt перед пушем в GitHub ─────────────────
      - name: Remove base64 files from sub
        run: rm -f sub/*.64.txt

      # ── 6. Коммит plain .txt в GitHub ───────────────────────────
      - name: Commit and push plain text files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/ README.md source.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ Изменений нет"; exit 0
          fi
          git commit -m "Auto-update proxy configs [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true; exit 1
            fi
            if git push origin main; then
              echo "✅ Push OK (попытка $i)"; exit 0
            fi
            sleep 5
          done
          exit 1
