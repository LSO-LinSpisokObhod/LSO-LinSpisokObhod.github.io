name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write

concurrency:
  group: "parser"
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      # ── 1. Парсер ────────────────────────────────────────────────
      - name: Run collector script
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      # ── 2. GitVerse: sub/ заменяется целиком (username + password) ──
      - name: Upload sub/ to GitVerse
        continue-on-error: true
        env:
          GV_USER:     ${{ secrets.GITVERSE_USER }}
          GV_REPO:     ${{ secrets.GITVERSE_REPO }}
          GV_PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
          GV_BRANCH:   ${{ secrets.GITVERSE_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GV_USER" ] || [ -z "$GV_REPO" ] || [ -z "$GV_PASSWORD" ]; then
            echo "❌ GitVerse: не заданы GV_USER / GV_REPO / GV_PASSWORD"
            exit 1
          fi

          if [[ "$GV_REPO" == */* ]]; then
            OWNER="${GV_REPO%%/*}"; REPO="${GV_REPO#*/}"
          else
            OWNER="$GV_USER"; REPO="$GV_REPO"
          fi
          echo "📦 GitVerse target: $OWNER/$REPO @ $GV_BRANCH"

          files=(sub/*.64.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠ GitVerse: нет sub/*.64.txt — пропуск"; exit 0
          fi

          AUTH="$(printf '%s:%s' "$GV_USER" "$GV_PASSWORD" | base64 -w0)"
          REPO_URL="https://gitverse.ru/${OWNER}/${REPO}.git"

          WORK="$(mktemp -d)"
          echo "📥 GitVerse: клонирую → $WORK/repo"
          if ! git -c http.extraHeader="Authorization: Basic $AUTH" \
                   clone --depth=1 --branch "$GV_BRANCH" "$REPO_URL" "$WORK/repo" 2>/dev/null; then
            echo "⚠ GitVerse: ветка '$GV_BRANCH' не найдена — создаю пустой репо"
            git init -b "$GV_BRANCH" "$WORK/repo"
            git -C "$WORK/repo" remote add origin "$REPO_URL"
          fi

          cd "$WORK/repo"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"

          echo "🗑 GitVerse: удаляю старую sub/"
          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/

          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            cp "$f" "sub/${base}.txt"
            echo "   $(basename "$f") → sub/${base}.txt"
          done

          git add -- sub/

          if git diff --cached --quiet; then
            echo "ℹ GitVerse: изменений нет — пропуск"; exit 0
          fi

          outside="$(git diff --cached --name-only | grep -v '^sub/' || true)"
          if [ -n "$outside" ]; then
            echo "❌ GitVerse: в staged есть файлы вне sub/ — отмена"
            printf '   %s\n' "$outside"; exit 1
          fi

          git commit -m "Sync sub/ [skip ci]"
          git -c http.extraHeader="Authorization: Basic $AUTH" push origin "$GV_BRANCH"
          echo "✅ GitVerse: $OWNER/$REPO@$GV_BRANCH обновлён"

      # ── 3. GitFlic: два коммита .64.txt → .txt (только токен) ────
      - name: Upload sub/ to GitFlic
        continue-on-error: true
        env:
          GF_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
          GF_REPO:   ${{ secrets.GITFLIC_REPO }}
          GF_BRANCH: ${{ secrets.GITFLIC_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GF_TOKEN" ] || [ -z "$GF_REPO" ]; then
            echo "❌ GitFlic: не заданы GF_TOKEN / GF_REPO"
            exit 1
          fi

          if [[ "$GF_REPO" != */* ]]; then
            echo "❌ GitFlic: GITFLIC_REPO должен быть owner/repo (например: liniptv/lso)"
            exit 1
          fi
          OWNER="${GF_REPO%%/*}"
          REPO="${GF_REPO#*/}"
          echo "📦 GitFlic target: $OWNER/$REPO @ $GF_BRANCH"

          files=(sub/*.64.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠ GitFlic: нет sub/*.64.txt — пропуск"; exit 0
          fi

          # Токен в URL; GitHub Actions маскирует значение секрета в логах
          REPO_URL="https://oauth2:${GF_TOKEN}@gitflic.ru/project/${OWNER}/${REPO}.git"
          CLEAN_URL="https://gitflic.ru/project/${OWNER}/${REPO}.git"

          WORK="$(mktemp -d)"
          echo "📥 GitFlic: клонирую → $WORK/repo"
          if ! git clone --depth=1 --branch "$GF_BRANCH" "$REPO_URL" "$WORK/repo" 2>/dev/null; then
            echo "⚠ GitFlic: ветка '$GF_BRANCH' не найдена — создаю пустой репо"
            git init -b "$GF_BRANCH" "$WORK/repo"
            git -C "$WORK/repo" remote add origin "$CLEAN_URL"
          else
            git -C "$WORK/repo" remote set-url origin "$CLEAN_URL"
          fi

          cd "$WORK/repo"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"

          # ── Проверка: нужно ли что-то менять? ──────────────────
          NEED_UPDATE=0

          # 1) новые файлы или изменилось содержимое
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then
              NEED_UPDATE=1; break
            fi
          done

          # 2) есть ли «осиротевшие» .txt, которых больше нет в свежей генерации
          if [ "$NEED_UPDATE" = "0" ]; then
            for target in sub/*.txt; do
              base="$(basename "$target" .txt)"
              if [ ! -f "$GITHUB_WORKSPACE/sub/${base}.64.txt" ]; then
                NEED_UPDATE=1; break
              fi
            done
          fi

          if [ "$NEED_UPDATE" = "0" ]; then
            echo "ℹ GitFlic: содержимое не изменилось — пропуск"; exit 0
          fi

          # ── Шаг A: сносим старую sub/, кладём *.64.txt как есть ──
          echo "🗑 GitFlic: удаляю старую sub/"
          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/

          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            cp "$f" "sub/$(basename "$f")"
            echo "   $(basename "$f") → sub/$(basename "$f")"
          done
          git add -- sub/
          git commit -m "Upload sub as .64.txt [skip ci]"
          echo "📝 GitFlic: коммит 1 — .64.txt загружены"

          # ── Шаг B: переименовываем *.64.txt → *.txt ────────────
          cd sub/
          for f in *.64.txt; do
            git mv "$f" "${f%.64.txt}.txt"
            echo "   $(basename "$f") → ${f%.64.txt}.txt"
          done
          cd ..
          git commit -m "Rename .64.txt to .txt [skip ci]"
          echo "📝 GitFlic: коммит 2 — .64.txt → .txt"

          # ── Проверка «только sub/» на итоговом коммите ─────────
          staged="$(git diff --name-only HEAD~2 HEAD 2>/dev/null || git ls-files)"
          outside="$(printf '%s\n' "$staged" | grep -v '^sub/' || true)"
          if [ -n "$outside" ]; then
            echo "❌ GitFlic: есть файлы вне sub/ — отмена"
            printf '   %s\n' "$outside"; exit 1
          fi

          # ── Один push на оба коммита ────────────────────────────
          git push origin "$GF_BRANCH"
          echo "✅ GitFlic: $OWNER/$REPO@$GF_BRANCH обновлён (2 коммита)"

      # ── 4. Убираем .64.txt перед пушем в GitHub ─────────────────
      - name: Remove base64 files from sub
        run: rm -f sub/*.64.txt

      # ── 5. Коммит plain .txt в GitHub ───────────────────────────
      - name: Commit and push plain text files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/ README.md source.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ Изменений нет — коммитить нечего"; exit 0
          fi
          git commit -m "Auto-update proxy configs [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true; exit 1
            fi
            if git push origin main; then
              echo "✅ Push OK (попытка $i)"; exit 0
            fi
            sleep 5
          done
          exit 1
