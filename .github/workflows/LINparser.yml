name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write

concurrency:
  group: "parser"
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install aiohttp

      # ── 1. Парсер ─────────────────────────────────────────────
      - name: Run parser
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      # ── 2. GitVerse (напрямую) ────────────────────────────────
      - name: Upload to GitVerse
        continue-on-error: true
        env:
          USER:     ${{ vars.GITVERSE_USER }}
          REPO:     ${{ vars.GITVERSE_REPO }}
          BRANCH:   ${{ vars.GITVERSE_BRANCH || 'master' }}
          PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
        run: |
          set -e; shopt -s nullglob
          [ -z "$USER" ] || [ -z "$REPO" ] || [ -z "$PASSWORD" ] && { echo "::warning::GitVerse пропуск"; exit 0; }
          U="$(printf '%s' "$USER" | tr -d ': @/')"; P="$(printf '%s' "$PASSWORD" | tr -d ': @/')"
          R="$(printf '%s' "$REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$R" in */*) OWNER="${R%%/*}"; REPO_N="${R##*/}" ;; *) OWNER="$U"; REPO_N="$R" ;; esac
          echo "📦 GitVerse: ${OWNER}/${REPO_N}@${BRANCH}"
          files=(sub/*.64.txt); [ ${#files[@]} -eq 0 ] && { echo "нет .64"; exit 0; }
          URL="https://gitverse.ru/${OWNER}/${REPO_N}.git"
          AUTH="$(printf '%s:%s' "$U" "$P" | base64 -w0)"
          G() { git -c http.extraHeader="Authorization: Basic $AUTH" "$@"; }
          W="$(mktemp -d)"; cd "$W"; git init -q
          git config user.name "github-actions[bot]"; git config user.email "actions@github.com"
          git remote add origin "$URL"
          if ERR=$(G fetch --depth=1 origin "$BRANCH" 2>&1); then
            git checkout -q -b "$BRANCH" FETCH_HEAD
          else
            echo "$ERR" | grep -qiE "couldn't find remote ref|not found" && \
              { git checkout -q --orphan "$BRANCH"; git rm -rfq . 2>/dev/null || true; } || \
              { echo "::warning::fetch fail"; exit 0; }
          fi
          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do cp "$f" "sub/$(basename "${f%.64.txt}").txt"; done
          git add -A sub/
          git diff --cached --quiet && { echo "ℹ без изменений"; exit 0; }
          git commit -q -m "Sync sub/ [skip ci]"
          if ! G push origin "$BRANCH"; then
            G fetch --depth=1 origin "$BRANCH" 2>/dev/null && \
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
            G push origin "$BRANCH" || { echo "::warning::push fail"; exit 0; }
          fi
          echo "✅ GitVerse OK"

      # ── 3. Mos.Hub через SSH-туннель ──────────────────────────
      - name: Upload to Mos.Hub via VPS
        continue-on-error: true
        env:
          VPS_HOST:    ${{ secrets.VPS_HOST }}
          VPS_PORT:    ${{ vars.VPS_PORT || '22' }}
          VPS_USER:    ${{ secrets.VPS_USER }}
          VPS_KEY:     ${{ secrets.VPS_SSH_KEY }}
          MH_USER:     ${{ vars.MOSHUB_USER }}
          MH_REPO:     ${{ vars.MOSHUB_REPO }}
          MH_BRANCH:   ${{ vars.MOSHUB_BRANCH || 'main' }}
          MH_TOKEN:    ${{ secrets.MOSHUB_TOKEN }}
        run: |
          set -e; shopt -s nullglob
          [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KEY" ] && { echo "::warning::VPS нет"; exit 0; }
          [ -z "$MH_USER" ] || [ -z "$MH_REPO" ] || [ -z "$MH_TOKEN" ] && { echo "::warning::Mos.Hub нет"; exit 0; }
          MU="$(printf '%s' "$MH_USER" | tr -d ': @/')"; MT="$(printf '%s' "$MH_TOKEN" | tr -d ': @/')"
          MR="$(printf '%s' "$MH_REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$MR" in */*) OWNER="${MR%%/*}"; REPO_N="${MR##*/}" ;; *) echo "::warning::MH_REPO"; exit 0 ;; esac
          echo "📦 Mos.Hub: ${OWNER}/${REPO_N}@${MH_BRANCH} через ${VPS_HOST}"
          files=(sub/*.64.txt); [ ${#files[@]} -eq 0 ] && { echo "нет .64"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/k; chmod 600 ~/.ssh/k
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O=(-i ~/.ssh/k -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new
             -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ExitOnForwardFailure=yes)
          ssh "${O[@]}" "$VPS_USER@$VPS_HOST" true 2>/dev/null || { echo "::error::SSH VPS fail"; exit 0; }
          ssh "${O[@]}" -f -N -D 127.0.0.1:1080 "$VPS_USER@$VPS_HOST"
          PID=$(pgrep -f "ssh .* -D 127.0.0.1:1080 .*$VPS_HOST" | tail -1 || true)
          trap '[ -n "$PID" ] && kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          CODE=$(curl -s --socks5-hostname 127.0.0.1:1080 --max-time 15 -o /dev/null -w '%{http_code}' https://hub.mos.ru/ || echo 000)
          [ "$CODE" = "000" ] && { echo "::error::tunnel fail"; exit 0; }
          echo "✅ tunnel HTTP $CODE"
          PROXY="socks5h://127.0.0.1:1080"
          URL="https://hub.mos.ru/${OWNER}/${REPO_N}.git"
          AUTH="$(printf '%s:%s' "$MU" "$MT" | base64 -w0)"
          G() { git -c "http.proxy=$PROXY" -c "https.proxy=$PROXY" -c http.extraHeader="Authorization: Basic $AUTH" "$@"; }
          W="$(mktemp -d)"; cd "$W"; git init -q
          git config user.name "github-actions[bot]"; git config user.email "actions@github.com"
          git remote add origin "$URL"
          if ERR=$(G fetch --depth=1 origin "$MH_BRANCH" 2>&1); then
            git checkout -q -b "$MH_BRANCH" FETCH_HEAD
          else
            echo "$ERR" | grep -qiE "couldn't find remote ref|not found" && \
              { git checkout -q --orphan "$MH_BRANCH"; git rm -rfq . 2>/dev/null || true; } || \
              { echo "::warning::fetch fail"; exit 0; }
          fi
          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do cp "$f" "sub/$(basename "$f")"; done
          git add -A sub/; git commit -q -m "Upload .64.txt [skip ci]"
          cd sub/; for f in *.64.txt; do git mv "$f" "${f%.64.txt}.txt"; done; cd ..
          git commit -q -m "Rename to .txt [skip ci]"
          if ! G push origin "$MH_BRANCH"; then
            G fetch --depth=1 origin "$MH_BRANCH" 2>/dev/null && \
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
            G push origin "$MH_BRANCH" || { echo "::warning::push fail"; exit 0; }
          fi
          echo "✅ Mos.Hub OK"

      # ── 4. GitFlic ────────────────────────────────────────────
      - name: Upload to GitFlic
        continue-on-error: true
        env:
          GF_USER:   ${{ vars.GITFLIC_USER }}
          GF_REPO:   ${{ vars.GITFLIC_REPO }}
          GF_BRANCH: ${{ vars.GITFLIC_BRANCH || 'master' }}
          GF_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
        run: |
          set -e; shopt -s nullglob
          [ -z "$GF_USER" ] || [ -z "$GF_TOKEN" ] || [ -z "$GF_REPO" ] && { echo "::warning::GitFlic нет"; exit 0; }
          GU="$(printf '%s' "$GF_USER" | tr -d ': @/')"; GT="$(printf '%s' "$GF_TOKEN" | tr -d ': @/')"
          GR="$(printf '%s' "$GF_REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$GR" in */*) OWNER="${GR%%/*}"; REPO_N="${GR##*/}" ;; *) echo "::warning::GF_REPO"; exit 0 ;; esac
          echo "📦 GitFlic: ${OWNER}/${REPO_N}@${GF_BRANCH}"
          files=(sub/*.64.txt); [ ${#files[@]} -eq 0 ] && { echo "нет .64"; exit 0; }
          URL="https://gitflic.ru/project/${OWNER}/${REPO_N}.git"
          AUTH="$(printf '%s:%s' "$GU" "$GT" | base64 -w0)"
          G() { git -c http.extraHeader="Authorization: Basic $AUTH" "$@"; }
          W="$(mktemp -d)"; cd "$W"; git init -q
          git config user.name "github-actions[bot]"; git config user.email "actions@github.com"
          git remote add origin "$URL"
          if ERR=$(G fetch --depth=1 origin "$GF_BRANCH" 2>&1); then
            git checkout -q -b "$GF_BRANCH" FETCH_HEAD
          else
            echo "$ERR" | grep -qiE "couldn't find remote ref|not found" && \
              { git checkout -q --orphan "$GF_BRANCH"; git rm -rfq . 2>/dev/null || true; } || \
              { echo "::warning::fetch fail"; exit 0; }
          fi
          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do cp "$f" "sub/$(basename "$f")"; done
          git add -A sub/; git commit -q -m "Upload .64.txt [skip ci]"
          cd sub/; for f in *.64.txt; do git mv "$f" "${f%.64.txt}.txt"; done; cd ..
          git commit -q -m "Rename to .txt [skip ci]"
          if ! G push origin "$GF_BRANCH"; then
            G fetch --depth=1 origin "$GF_BRANCH" 2>/dev/null && \
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
            G push origin "$GF_BRANCH" || { echo "::warning::push fail"; exit 0; }
          fi
          echo "✅ GitFlic OK"

      # ── 5. GitHub (plain) ─────────────────────────────────────
      - name: Remove base64
        run: rm -f sub/*.64.txt

      - name: Commit plain to GitHub
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/ README.md source.txt
          git diff --quiet && git diff --staged --quiet && { echo "ℹ нет изменений"; exit 0; }
          git commit -m "Auto-update configs [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase --autostash origin main 2>/dev/null; then
              git rebase --abort 2>/dev/null || true; git reset --hard HEAD; exit 0
            fi
            git push origin main 2>/dev/null && { echo "✅ GitHub OK"; exit 0; }
            sleep 5
          done
          echo "::warning::GitHub push fail"; exit 0
