name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write

concurrency:
  group: "parser"
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      # ── 0. Диагностика ──────────────────────────────────────────
      - name: Debug secrets visibility
        env:
          GITFLIC_USER:   ${{ secrets.GITFLIC_USER }}
          GITFLIC_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
          GITFLIC_REPO:   ${{ secrets.GITFLIC_REPO }}
          GITFLIC_BRANCH: ${{ secrets.GITFLIC_BRANCH }}
          GITVERSE_USER:     ${{ secrets.GITVERSE_USER }}
          GITVERSE_REPO:     ${{ secrets.GITVERSE_REPO }}
          GITVERSE_PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
        run: |
          echo "=== GitFlic ==="
          echo "GITFLIC_USER   → длина: ${#GITFLIC_USER}   [$([ -n "$GITFLIC_USER" ] && echo 'задан' || echo 'ПУСТО')]"
          echo "GITFLIC_TOKEN  → длина: ${#GITFLIC_TOKEN}  [$([ -n "$GITFLIC_TOKEN" ] && echo 'задан' || echo 'ПУСТО')]"
          echo "GITFLIC_REPO   → значение: [$GITFLIC_REPO]"
          echo "GITFLIC_BRANCH → значение: [${GITFLIC_BRANCH:-<default: master>}]"
          echo ""
          echo "=== GitVerse ==="
          echo "GITVERSE_USER     → длина: ${#GITVERSE_USER}   [$([ -n "$GITVERSE_USER" ] && echo 'задан' || echo 'ПУСТО')]"
          echo "GITVERSE_REPO     → значение: [$GITVERSE_REPO]"
          echo "GITVERSE_PASSWORD → длина: ${#GITVERSE_PASSWORD}  [$([ -n "$GITVERSE_PASSWORD" ] && echo 'задан' || echo 'ПУСТО')]"

      # ── 1. Парсер ───────────────────────────────────────────────
      - name: Run collector script
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      # ── 2. GitVerse ─────────────────────────────────────────────
      - name: Upload sub/ to GitVerse
        continue-on-error: true
        env:
          GITVERSE_USER:     ${{ secrets.GITVERSE_USER }}
          GITVERSE_REPO:     ${{ secrets.GITVERSE_REPO }}
          GITVERSE_PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
          GITVERSE_BRANCH:   ${{ secrets.GITVERSE_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GITVERSE_USER" ] || [ -z "$GITVERSE_REPO" ] || [ -z "$GITVERSE_PASSWORD" ]; then
            echo "::warning::GitVerse: пропуск — не заданы GITVERSE_USER/REPO/PASSWORD"
            exit 0
          fi

          if [[ "$GITVERSE_REPO" == */* ]]; then
            OWNER="${GITVERSE_REPO%%/*}"; REPO="${GITVERSE_REPO#*/}"
          else
            OWNER="$GITVERSE_USER"; REPO="$GITVERSE_REPO"
          fi
          echo "📦 GitVerse target: $OWNER/$REPO @ $GITVERSE_BRANCH"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitVerse: нет sub/*.64.txt"; exit 0; }

          AUTH="$(printf '%s:%s' "$GITVERSE_USER" "$GITVERSE_PASSWORD" | base64 -w0)"
          REPO_URL="https://gitverse.ru/${OWNER}/${REPO}.git"

          WORK="$(mktemp -d)"
          if ! git -c http.extraHeader="Authorization: Basic $AUTH" \
               clone --depth=1 --branch "$GITVERSE_BRANCH" "$REPO_URL" "$WORK/repo" 2>/dev/null; then
            git init -b "$GITVERSE_BRANCH" "$WORK/repo"
            git -C "$WORK/repo" remote add origin "$REPO_URL"
          fi
          cd "$WORK/repo"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"

          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            cp "$f" "sub/${base}.txt"
          done
          git add -- sub/
          git diff --cached --quiet && { echo "ℹ GitVerse: изменений нет"; exit 0; }

          outside="$(git diff --cached --name-only | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }

          git commit -m "Sync sub/ [skip ci]"
          git -c http.extraHeader="Authorization: Basic $AUTH" push origin "$GITVERSE_BRANCH"
          echo "✅ GitVerse: $OWNER/$REPO@$GITVERSE_BRANCH обновлён"

      # ── 3. GitFlic ──────────────────────────────────────────────
      - name: Upload sub/ to GitFlic
        continue-on-error: true
        env:
          GITFLIC_USER:   ${{ secrets.GITFLIC_USER }}
          GITFLIC_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
          GITFLIC_REPO:   ${{ secrets.GITFLIC_REPO }}
          GITFLIC_BRANCH: ${{ secrets.GITFLIC_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GITFLIC_TOKEN" ]; then
            echo "::warning::GitFlic: GITFLIC_TOKEN пуст — пропуск"; exit 0
          fi
          if [ -z "$GITFLIC_USER" ]; then
            echo "::warning::GitFlic: GITFLIC_USER пуст — пропуск"; exit 0
          fi
          if [ -z "$GITFLIC_REPO" ] || [[ "$GITFLIC_REPO" != */* ]]; then
            echo "::warning::GitFlic: GITFLIC_REPO должен быть owner/repo — пропуск"; exit 0
          fi

          OWNER="${GITFLIC_REPO%%/*}"
          REPO="${GITFLIC_REPO#*/}"
          echo "📦 GitFlic target: $OWNER/$REPO @ $GITFLIC_BRANCH"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitFlic: нет sub/*.64.txt"; exit 0; }

          REPO_URL="https://${GITFLIC_USER}:${GITFLIC_TOKEN}@gitflic.ru/project/${OWNER}/${REPO}.git"
          CLEAN_URL="https://gitflic.ru/project/${OWNER}/${REPO}.git"

          WORK="$(mktemp -d)/repo"
          if ! git clone --depth=1 --branch "$GITFLIC_BRANCH" "$REPO_URL" "$WORK" 2>/dev/null; then
            AUTH=$(printf '%s:%s' "$GITFLIC_USER" "$GITFLIC_TOKEN" | base64 -w0)
            if ! git -c http.extraHeader="Authorization: Basic $AUTH" \
                 clone --depth=1 --branch "$GITFLIC_BRANCH" "$CLEAN_URL" "$WORK" 2>/dev/null; then
              rm -rf "$WORK"
              git init -b "$GITFLIC_BRANCH" "$WORK"
              git -C "$WORK" remote add origin "$CLEAN_URL"
            fi
          fi

          cd "$WORK"
          git remote set-url origin "$CLEAN_URL"
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"

          NEED_UPDATE=0
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then
              NEED_UPDATE=1; break
            fi
          done
          [ "$NEED_UPDATE" = "0" ] && { echo "ℹ GitFlic: не изменилось"; exit 0; }

          git rm -r --cached sub/ 2>/dev/null || true
          rm -rf sub/
          mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            cp "$f" "sub/$(basename "$f")"
          done
          git add -- sub/
          git commit -m "Upload sub as .64.txt [skip ci]" >/dev/null
          echo "📝 GitFlic: коммит 1 — .64.txt"

          cd sub/
          for f in *.64.txt; do
            git mv "$f" "${f%.64.txt}.txt"
          done
          cd ..
          git commit -m "Rename .64.txt to .txt [skip ci]" >/dev/null
          echo "📝 GitFlic: коммит 2 — .txt"

          outside="$(git diff --name-only HEAD~2 HEAD 2>/dev/null | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }

          if ! git push "https://${GITFLIC_USER}:${GITFLIC_TOKEN}@gitflic.ru/project/${OWNER}/${REPO}.git" "$GITFLIC_BRANCH" 2>/dev/null; then
            echo "::error::GitFlic: push отклонён — проверь GITFLIC_TOKEN и GITFLIC_USER"
            exit 1
          fi
          echo "✅ GitFlic: $OWNER/$REPO@$GITFLIC_BRANCH обновлён (2 коммита)"

      # ── 4. Убираем .64.txt перед пушем в GitHub ─────────────────
      - name: Remove base64 files from sub
        run: rm -f sub/*.64.txt

      # ── 5. Коммит plain .txt в GitHub ───────────────────────────
      - name: Commit and push plain text files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/ README.md source.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ Изменений нет"; exit 0
          fi
          git commit -m "Auto-update proxy configs [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true; exit 1
            fi
            if git push origin main; then
              echo "✅ Push OK (попытка $i)"; exit 0
            fi
            sleep 5
          done
          exit 1
