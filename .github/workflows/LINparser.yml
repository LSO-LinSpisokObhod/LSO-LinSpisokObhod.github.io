name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write

concurrency:
  group: "parser"
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      # ── 1. Парсер ───────────────────────────────────────────────
      - name: Run collector script
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      # ── 2. GitVerse ─────────────────────────────────────────────
      - name: Upload sub/ to GitVerse
        continue-on-error: true
        env:
          GITVERSE_USER:     ${{ secrets.GITVERSE_USER }}
          GITVERSE_REPO:     ${{ secrets.GITVERSE_REPO }}
          GITVERSE_PASSWORD: ${{ secrets.GITVERSE_PASSWORD }}
          GITVERSE_BRANCH:   ${{ secrets.GITVERSE_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GITVERSE_USER" ] || [ -z "$GITVERSE_REPO" ] || [ -z "$GITVERSE_PASSWORD" ]; then
            echo "::warning::GitVerse: пропуск — не заданы секреты"; exit 0
          fi

          # Санитизация: убираем все ':', '@', '/', пробелы из креденшелов
          GV_USER_CLEAN="$(printf '%s' "$GITVERSE_USER"     | tr -d ': @/')"
          GV_PASS_CLEAN="$(printf '%s' "$GITVERSE_PASSWORD" | tr -d ': @/')"
          # Разбор repo: 'owner/repo', '/owner/repo', 'https://.../owner/repo(.git)?'
          GV_REPO_CLEAN="$(printf '%s' "$GITVERSE_REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$GV_REPO_CLEAN" in
            */*) OWNER="${GV_REPO_CLEAN%%/*}"; REPO="${GV_REPO_CLEAN##*/}" ;;
            *)   OWNER="$GV_USER_CLEAN"; REPO="$GV_REPO_CLEAN" ;;
          esac
          echo "📦 GitVerse target: ${OWNER}/${REPO} @ ${GITVERSE_BRANCH}"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitVerse: нет sub/*.64.txt"; exit 0; }

          REPO_URL="https://gitverse.ru/${OWNER}/${REPO}.git"
          # Basic Auth в заголовке: ':' между user и pass формируется ЗДЕСЬ, а не в URL
          AUTH_BASIC="$(printf '%s:%s' "$GV_USER_CLEAN" "$GV_PASS_CLEAN" | base64 -w0)"
          GIT() { git -c http.extraHeader="Authorization: Basic $AUTH_BASIC" "$@"; }

          WORK="$(mktemp -d)/repo"
          mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git remote add origin "$REPO_URL"

          if ERR=$(GIT fetch --depth=1 origin "$GITVERSE_BRANCH" 2>&1); then
            git checkout -q -b "$GITVERSE_BRANCH" FETCH_HEAD
            echo "📥 GitVerse: ветка $GITVERSE_BRANCH загружена"
          else
            if echo "$ERR" | grep -qiE "couldn't find remote ref|could not find remote branch|remote branch .* not found"; then
              echo "⚠ GitVerse: ветки $GITVERSE_BRANCH нет — создаю пустую"
              git checkout -q --orphan "$GITVERSE_BRANCH"
              git rm -rfq . 2>/dev/null || true
            else
              echo "::warning::GitVerse: fetch не удался — пропуск (ветка НЕ тронется)"
              echo "$ERR" | head -5
              exit 0
            fi
          fi

          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            cp "$f" "sub/${base}.txt"
          done
          git add -A sub/
          git diff --cached --quiet && { echo "ℹ GitVerse: изменений нет"; exit 0; }
          outside="$(git diff --cached --name-only | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }
          git commit -q -m "Sync sub/ [skip ci]"

          if ! GIT push origin "$GITVERSE_BRANCH" 2>&1; then
            echo "⚠ GitVerse: push отклонён — синхронизируюсь и повторяю"
            if GIT fetch --depth=1 origin "$GITVERSE_BRANCH" 2>/dev/null; then
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
              GIT push origin "$GITVERSE_BRANCH" 2>&1 && { echo "✅ GitVerse: ${OWNER}/${REPO}@${GITVERSE_BRANCH} обновлён (retry)"; exit 0; }
            fi
            echo "::warning::GitVerse: push не удался — ветка не тронута"; exit 0
          fi
          echo "✅ GitVerse: ${OWNER}/${REPO}@${GITVERSE_BRANCH} обновлён"

      # ── 3. Mos.Hub ─────────────────────────────────────────────
      - name: Upload sub/ to Mos.Hub
        continue-on-error: true
        env:
          MOSHUB_USER:   ${{ secrets.MOSHUB_USER }}
          MOSHUB_TOKEN:  ${{ secrets.MOSHUB_TOKEN }}
          MOSHUB_REPO:   ${{ secrets.MOSHUB_REPO }}
          MOSHUB_BRANCH: ${{ secrets.MOSHUB_BRANCH || 'main' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$MOSHUB_USER" ] || [ -z "$MOSHUB_TOKEN" ] || [ -z "$MOSHUB_REPO" ]; then
            echo "::warning::Mos.Hub: пропуск — не заданы секреты"; exit 0
          fi

          MH_USER_CLEAN="$(printf '%s' "$MOSHUB_USER"  | tr -d ': @/')"
          MH_TOKEN_CLEAN="$(printf '%s' "$MOSHUB_TOKEN" | tr -d ': @/')"
          MH_REPO_CLEAN="$(printf '%s' "$MOSHUB_REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$MH_REPO_CLEAN" in
            */*) OWNER="${MH_REPO_CLEAN%%/*}"; REPO="${MH_REPO_CLEAN##*/}" ;;
            *)   echo "::warning::Mos.Hub: MOSHUB_REPO должен быть owner/repo"; exit 0 ;;
          esac
          echo "📦 Mos.Hub target: ${OWNER}/${REPO} @ ${MOSHUB_BRANCH}"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ Mos.Hub: нет sub/*.64.txt"; exit 0; }

          REPO_URL="https://hub.mos.ru/${OWNER}/${REPO}.git"
          AUTH_BASIC="$(printf '%s:%s' "$MH_USER_CLEAN" "$MH_TOKEN_CLEAN" | base64 -w0)"
          GIT() { git -c http.extraHeader="Authorization: Basic $AUTH_BASIC" "$@"; }

          WORK="$(mktemp -d)/repo"
          mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git remote add origin "$REPO_URL"

          if ERR=$(GIT fetch --depth=1 origin "$MOSHUB_BRANCH" 2>&1); then
            git checkout -q -b "$MOSHUB_BRANCH" FETCH_HEAD
            echo "📥 Mos.Hub: ветка $MOSHUB_BRANCH загружена"
          else
            if echo "$ERR" | grep -qiE "couldn't find remote ref|could not find remote branch|remote branch .* not found"; then
              echo "⚠ Mos.Hub: ветки $MOSHUB_BRANCH нет — создаю пустую"
              git checkout -q --orphan "$MOSHUB_BRANCH"
              git rm -rfq . 2>/dev/null || true
            else
              echo "::warning::Mos.Hub: fetch не удался — пропуск (ветка НЕ тронется)"
              echo "$ERR" | head -5
              exit 0
            fi
          fi

          NEED_UPDATE=0
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then NEED_UPDATE=1; break; fi
          done
          [ "$NEED_UPDATE" = "0" ] && { echo "ℹ Mos.Hub: содержимое не изменилось"; exit 0; }

          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do cp "$f" "sub/$(basename "$f")"; done
          git add -A sub/
          git commit -q -m "Upload sub as .64.txt [skip ci]"
          echo "📝 Mos.Hub: коммит 1 — .64.txt"

          cd sub/
          for f in *.64.txt; do git mv "$f" "${f%.64.txt}.txt"; done
          cd ..
          git commit -q -m "Rename .64.txt to .txt [skip ci]"
          echo "📝 Mos.Hub: коммит 2 — .txt"

          outside="$(git diff --name-only HEAD~2 HEAD 2>/dev/null | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }

          if ! GIT push origin "$MOSHUB_BRANCH" 2>&1; then
            echo "⚠ Mos.Hub: push отклонён — синхронизируюсь и повторяю"
            if GIT fetch --depth=1 origin "$MOSHUB_BRANCH" 2>/dev/null; then
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
              GIT push origin "$MOSHUB_BRANCH" 2>&1 && { echo "✅ Mos.Hub: ${OWNER}/${REPO}@${MOSHUB_BRANCH} обновлён (retry)"; exit 0; }
            fi
            echo "::warning::Mos.Hub: push не удался — ветка не тронута"; exit 0
          fi
          echo "✅ Mos.Hub: ${OWNER}/${REPO}@${MOSHUB_BRANCH} обновлён (2 коммита)"

      # ── 4. GitFlic ──────────────────────────────────────────────
      - name: Upload sub/ to GitFlic
        continue-on-error: true
        env:
          GITFLIC_USER:   ${{ secrets.GITFLIC_USER }}
          GITFLIC_TOKEN:  ${{ secrets.GITFLIC_TOKEN }}
          GITFLIC_REPO:   ${{ secrets.GITFLIC_REPO }}
          GITFLIC_BRANCH: ${{ secrets.GITFLIC_BRANCH || 'master' }}
        run: |
          set -e
          shopt -s nullglob

          if [ -z "$GITFLIC_USER" ] || [ -z "$GITFLIC_TOKEN" ] || [ -z "$GITFLIC_REPO" ]; then
            echo "::warning::GitFlic: пропуск — не заданы секреты"; exit 0
          fi

          GF_USER_CLEAN="$(printf '%s' "$GITFLIC_USER"  | tr -d ': @/')"
          GF_TOKEN_CLEAN="$(printf '%s' "$GITFLIC_TOKEN" | tr -d ': @/')"
          GF_REPO_CLEAN="$(printf '%s' "$GITFLIC_REPO" | sed -E 's#^[a-zA-Z]+://##; s#\.git$##; s#/$##')"
          case "$GF_REPO_CLEAN" in
            */*) OWNER="${GF_REPO_CLEAN%%/*}"; REPO="${GF_REPO_CLEAN##*/}" ;;
            *)   echo "::warning::GitFlic: GITFLIC_REPO должен быть owner/repo"; exit 0 ;;
          esac
          echo "📦 GitFlic target: ${OWNER}/${REPO} @ ${GITFLIC_BRANCH}"

          files=(sub/*.64.txt)
          [ ${#files[@]} -eq 0 ] && { echo "⚠ GitFlic: нет sub/*.64.txt"; exit 0; }

          REPO_URL="https://gitflic.ru/project/${OWNER}/${REPO}.git"
          AUTH_BASIC="$(printf '%s:%s' "$GF_USER_CLEAN" "$GF_TOKEN_CLEAN" | base64 -w0)"
          GIT() { git -c http.extraHeader="Authorization: Basic $AUTH_BASIC" "$@"; }

          WORK="$(mktemp -d)/repo"
          mkdir -p "$WORK"; cd "$WORK"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "actions@github.com"
          git remote add origin "$REPO_URL"

          if ERR=$(GIT fetch --depth=1 origin "$GITFLIC_BRANCH" 2>&1); then
            git checkout -q -b "$GITFLIC_BRANCH" FETCH_HEAD
            echo "📥 GitFlic: ветка $GITFLIC_BRANCH загружена"
          else
            if echo "$ERR" | grep -qiE "couldn't find remote ref|could not find remote branch|remote branch .* not found"; then
              echo "⚠ GitFlic: ветки $GITFLIC_BRANCH нет — создаю пустую"
              git checkout -q --orphan "$GITFLIC_BRANCH"
              git rm -rfq . 2>/dev/null || true
            else
              echo "::warning::GitFlic: fetch не удался — пропуск (ветка НЕ тронется)"
              echo "$ERR" | head -5
              exit 0
            fi
          fi

          NEED_UPDATE=0
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do
            base="$(basename "$f" .64.txt)"
            target="sub/${base}.txt"
            if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then NEED_UPDATE=1; break; fi
          done
          [ "$NEED_UPDATE" = "0" ] && { echo "ℹ GitFlic: не изменилось"; exit 0; }

          rm -rf sub/; mkdir -p sub/
          for f in "$GITHUB_WORKSPACE"/sub/*.64.txt; do cp "$f" "sub/$(basename "$f")"; done
          git add -A sub/
          git commit -q -m "Upload sub as .64.txt [skip ci]"
          echo "📝 GitFlic: коммит 1 — .64.txt"

          cd sub/
          for f in *.64.txt; do git mv "$f" "${f%.64.txt}.txt"; done
          cd ..
          git commit -q -m "Rename .64.txt to .txt [skip ci]"
          echo "📝 GitFlic: коммит 2 — .txt"

          outside="$(git diff --name-only HEAD~2 HEAD 2>/dev/null | grep -v '^sub/' || true)"
          [ -n "$outside" ] && { echo "❌ файлы вне sub/"; exit 1; }

          if ! GIT push origin "$GITFLIC_BRANCH" 2>&1; then
            echo "⚠ GitFlic: push отклонён — синхронизируюсь и повторяю"
            if GIT fetch --depth=1 origin "$GITFLIC_BRANCH" 2>/dev/null; then
              git merge --allow-unrelated-histories -m merge FETCH_HEAD >/dev/null 2>&1 || true
              GIT push origin "$GITFLIC_BRANCH" 2>&1 && { echo "✅ GitFlic: ${OWNER}/${REPO}@${GITFLIC_BRANCH} обновлён (retry)"; exit 0; }
            fi
            echo "::warning::GitFlic: push не удался — ветка не тронута"; exit 0
          fi
          echo "✅ GitFlic: ${OWNER}/${REPO}@${GITFLIC_BRANCH} обновлён (2 коммита)"

      # ── 5. Убираем .64.txt перед пушем в GitHub ─────────────────
      - name: Remove base64 files from sub
        run: rm -f sub/*.64.txt

      # ── 6. Коммит plain .txt в GitHub ───────────────────────────
      - name: Commit and push plain text files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub/ README.md source.txt
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ Изменений нет"; exit 0
          fi
          git commit -m "Auto-update proxy configs [skip ci]"
          for i in 1 2 3; do
            if ! git pull --rebase --autostash origin main 2>/dev/null; then
              git rebase --abort 2>/dev/null || true
              git reset --hard HEAD
              echo "::warning::GitHub: pull --rebase не удался — пропуск"; exit 0
            fi
            if git push origin main 2>/dev/null; then
              echo "✅ GitHub: push OK (попытка $i)"; exit 0
            fi
            sleep 5
          done
          echo "::warning::GitHub: push не удался — ветка не тронута"; exit 0
