name: Collect & Sync Proxies

on:
  schedule:
    - cron: '17 * * * *'        # ⏰ раз в час в :17 (UTC)
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [parser-run, rebuild]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Парсер: собирает конфиги, чистит base64, коммитит на GitHub
  # ────────────────────────────────────────────────────────────
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Важно: тянем именно main и с полной историей,
          # чтобы pull --rebase работал корректно
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install aiohttp

      - name: Run collector script
        continue-on-error: true
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python "parser[#LSO-#LinSpisokObhod].py"

      - name: Remove base64 files from sub
        run: rm -f sub/*.64.txt

      - name: Commit and push plain text files to GitHub
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub/ README.md source.txt

          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ Изменений нет — коммитить нечего"
            exit 0
          fi

          git commit -m "Auto-update proxy configs [skip ci]"

          # До 3 попыток: pull --rebase → push.
          # Если между pull и push кто-то ещё раз запушил — пробуем снова.
          for i in 1 2 3; do
            echo "▶ Попытка $i: pull --rebase"
            if ! git pull --rebase --autostash origin main; then
              echo "⚠ Rebase не удался (конфликт?)"
              git rebase --abort || true
              exit 1
            fi

            echo "▶ Попытка $i: push"
            if git push origin main; then
              echo "✅ Push OK (попытка $i)"
              exit 0
            fi

            echo "⚠ Push отклонён — повтор через 5 сек (попытка $i)"
            sleep 5
          done

          echo "❌ Не удалось запушить после 3 попыток"
          exit 1

  # ────────────────────────────────────────────────────────────
  # 2. Сборка Jekyll
  # ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: parser
    # собираем даже если парсер упал — только не если отменили
    if: always() && needs.parser.result != 'cancelled'

    steps:
      # Parser мог закоммитить новый HEAD → берём свежий main,
      # а не устаревший SHA, на котором стартовал workflow
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # ────────────────────────────────────────────────────────────
  # 3. Деплой на GitHub Pages
  # ────────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
